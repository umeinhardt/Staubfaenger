name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## 3D Dust Particle Aggregation Simulation
            
            ### ✨ Features
            - 3D particle physics with Newton's mechanics
            - Adaptive time steps for stable 60 FPS
            - Barnes-Hut algorithm for O(n log n) gravity computation
            - Parallel collision detection using Web Workers
            - Level of Detail (LOD) optimization
            - Boundary modes: Bounce and Wrap-around
            
            ### 🚀 Performance
            - 1000+ particles at 60 FPS
            
            ### 📦 Downloads
            
            **Windows:**
            - `DustParticleAggregation-Windows-Setup.exe` - Installer (recommended)
            - `DustParticleAggregation-Windows-Portable.zip` - No installation required
            
            ### 🌐 Try it online
            
            No download needed: https://umeinhardt.github.io/Staubfaenger/
            
            ### 📝 Installation
            
            1. Download the Setup.exe file
            2. Run it and follow the installer
            3. Launch from Start Menu or Desktop
            
            Or use the Portable ZIP (no installation required).
          draft: false
          prerelease: false

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Build Electron app (Windows only)
        run: npm run electron:build -- --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: List release directory
        shell: pwsh
        run: |
          Write-Host "Contents of release directory:"
          Get-ChildItem -Path release -Recurse | Select-Object FullName
      
      - name: Find and upload installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "*.exe" -Recurse | Select-Object -First 1
          if ($installer) {
            Write-Host "Found installer: $($installer.FullName)"
            echo "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_ENV
            echo "INSTALLER_FOUND=true" >> $env:GITHUB_ENV
          } else {
            Write-Host "No installer found"
            echo "INSTALLER_FOUND=false" >> $env:GITHUB_ENV
          }
      
      - name: Upload Windows Installer
        if: env.INSTALLER_FOUND == 'true'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ env.INSTALLER_PATH }}
          asset_name: DustParticleAggregation-Windows-Setup.exe
          asset_content_type: application/octet-stream
      
      - name: Check for portable version
        shell: pwsh
        run: |
          if (Test-Path "release/win-unpacked") {
            Write-Host "Found win-unpacked directory"
            echo "PORTABLE_FOUND=true" >> $env:GITHUB_ENV
          } else {
            Write-Host "No win-unpacked directory found"
            echo "PORTABLE_FOUND=false" >> $env:GITHUB_ENV
          }
      
      - name: Zip portable version
        if: env.PORTABLE_FOUND == 'true'
        shell: pwsh
        run: Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "DustParticleAggregation-Windows-Portable.zip"
      
      - name: Upload Windows Portable
        if: env.PORTABLE_FOUND == 'true'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./DustParticleAggregation-Windows-Portable.zip
          asset_name: DustParticleAggregation-Windows-Portable.zip
          asset_content_type: application/zip
